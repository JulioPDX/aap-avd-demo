veos:
  # Define the global vEOS node parameters
  username: juliopdx
  password: juliopdx
  version: 4.35.4M

cvp:
  username: juliopdx
  password: juliopdx
  version: 2025.3.3

# List of ACT nodes
nodes:
  - cvp:
      ip_addr: 192.168.0.5
      node_type: cvp
      auto_configuration: true
      instance_type: large
  - spine1:
      ip_addr: 192.168.0.101
      node_type: veos
      internet_access: true

  - spine2:
      ip_addr: 192.168.0.102
      node_type: veos
      internet_access: true

  - leaf1a:
      ip_addr: 192.168.0.103
      node_type: veos
      internet_access: true

  - leaf1b:
      ip_addr: 192.168.0.104
      node_type: veos
      internet_access: true

links:
    - connection:
        - spine1:Ethernet1
        - leaf1a:Ethernet1
    - connection:
        - spine1:Ethernet2
        - leaf1b:Ethernet1
    - connection:
        - spine2:Ethernet1
        - leaf1a:Ethernet2
    - connection:
        - spine2:Ethernet2
        - leaf1b:Ethernet2
    # leaf to leaf
    - connection:
        - leaf1a:Ethernet3
        - leaf1b:Ethernet3
    - connection:
        - leaf1a:Ethernet4
        - leaf1b:Ethernet4
