ethernet_interfaces:
- name: Ethernet1
  description: MLAG_s1-leaf3_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: s1-leaf3
    peer_interface: Ethernet1
    peer_type: mlag_peer
- name: Ethernet6
  description: MLAG_s1-leaf3_Ethernet6
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: s1-leaf3
    peer_interface: Ethernet6
    peer_type: mlag_peer
- name: Ethernet2
  description: P2P_s1-spine1_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.13/31
  metadata:
    peer: s1-spine1
    peer_interface: Ethernet5
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_s1-spine2_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.15/31
  metadata:
    peer: s1-spine2
    peer_interface: Ethernet5
    peer_type: spine
  switchport:
    enabled: false
hostname: s1-leaf4
ip_domain_lookup:
  source_interfaces:
  - name: Management0
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: default
    servers:
    - ip_address: 1.1.1.1
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.6/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.1.5/32
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.15/24
  type: oob
metadata:
  is_deployed: true
  platform: cEOS-lab
  fabric_name: FABRIC
mlag_configuration:
  domain_id: LEAF2
  local_interface: Vlan4094
  peer_address: 10.255.1.68
  peer_link: Port-Channel1
ntp:
  local_interface:
    name: Management0
    vrf: default
  servers:
  - name: 0.pool.ntp.org
    preferred: true
  vrf: default
port_channel_interfaces:
- name: Port-Channel1
  description: MLAG_s1-leaf3_Port-Channel1
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.0.0/27 eq 32
  - sequence: 20
    action: permit 10.255.1.0/27 eq 32
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65102'
  router_id: 10.255.0.6
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65102'
    description: s1-leaf3
    next_hop_self: true
    password: 4b21pAdCvWeAqpcKDFMdWw==
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: 7x4B4rnJhZB438m9+BrBfQ==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    password: Q4fqtbqcZ7oQuKfuWtNGRQ==
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.255.1.100
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: s1-leaf3
    description: s1-leaf3_Vlan4093
  - ip_address: 10.255.255.12
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: s1-spine1
    description: s1-spine1_Ethernet5
  - ip_address: 10.255.255.14
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: s1-spine2
    description: s1-spine2_Ethernet5
  - ip_address: 10.255.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: s1-spine1
    description: s1-spine1_Loopback0
  - ip_address: 10.255.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: s1-spine2
    description: s1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 10.255.1.101/31
  mtu: 9214
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.255.1.69/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
vrfs:
- name: default
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: s1-leaf4_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
