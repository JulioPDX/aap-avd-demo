aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
eos_cli: "username admin privilege 15 role network-admin secret 5 $1$5O85YVVn$HrXcfOivJEnISTMb6xrJc.\nusername arista privilege 15 role
  network-admin secret 5 $1$4VjIjfd1$XkUVulbNDESHFzcxDU.Tk1\nusername arista ssh-key ssh-rsa 
  arista@aap-demo-1-6d679806-eos\n!\nmanagement api http-commands\n  no shutdown\n!\ndaemon TerminAttr\n  exec /usr/bin/TerminAttr -cvcompression=gzip
  -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -cvaddr=192.168.0.5:9910
  -cvauth=token,/tmp/token -cvvrf=default -taillogs -disableaaa\n  no shutdown\n!"
ethernet_interfaces:
- name: Ethernet2
  description: P2P_s1-leaf1_Ethernet3
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.2/31
  metadata:
    peer: s1-leaf1
    peer_interface: Ethernet3
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_s1-leaf2_Ethernet3
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.6/31
  metadata:
    peer: s1-leaf2
    peer_interface: Ethernet3
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: s1-spine2
ip_domain_lookup:
  source_interfaces:
  - name: Management0
ip_name_server:
  vrfs:
  - name: default
    servers:
    - ip_address: 1.1.1.1
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.2/32
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.11/24
  type: oob
metadata:
  is_deployed: true
  platform: cEOS-lab
  fabric_name: FABRIC
ntp:
  local_interface:
    name: Management0
    vrf: default
  servers:
  - name: 0.pool.ntp.org
    preferred: true
  vrf: default
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.0.0/27 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.255.0.2
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: 7x4B4rnJhZB438m9+BrBfQ==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    password: Q4fqtbqcZ7oQuKfuWtNGRQ==
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.255.255.3
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: s1-leaf1
    description: s1-leaf1_Ethernet3
  - ip_address: 10.255.255.7
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: s1-leaf2
    description: s1-leaf2_Ethernet3
  - ip_address: 10.255.0.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: s1-leaf1
    description: s1-leaf1_Loopback0
  - ip_address: 10.255.0.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: s1-leaf2
    description: s1-leaf2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: default
  ip_routing: false
